<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Build, run and share robots in your browser. No install." />
    <title>PAI Sim</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='5' y='9' width='22' height='12' rx='3' fill='%23293040'/><circle cx='10' cy='23' r='4' fill='%23e9733f'/><circle cx='22' cy='23' r='4' fill='%23e9733f'/></svg>" />
  </head>
  <body>
    <header class="bar">
      <div class="brand">PAI&nbsp;Sim <span class="tag">preview</span></div>
      <div id="hud" class="hud" aria-live="off"></div>
      <div class="scene-controls">
        <label for="scene-picker" class="visually-hidden">Scene</label>
        <select id="scene-picker" title="Choose a scene"></select>
        <label for="env-picker" class="visually-hidden">Environment</label>
        <select id="env-picker" title="Put your robot in an environment with a goal"></select>
        <input id="file-input" class="visually-hidden" type="file" accept=".xml,.mjcf,text/xml,application/xml" />
        <label for="file-input" class="file-button" title="Open a MuJoCo .xml model from your device (or drop it on the page)">Open .xml</label>
      </div>
      <div class="actions">
        <button id="builder-toggle" type="button" aria-expanded="false" aria-controls="builder">Build</button>
        <button id="code-toggle" type="button" aria-expanded="false" aria-controls="code">Code</button>
        <button id="share-toggle" type="button" aria-expanded="false" aria-controls="share" title="Share a link to this sim"><svg class="share-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 15V3" /><path d="M7 8l5-5 5 5" /><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7" /></svg><span class="share-label">Share</span></button>
        <button id="pause" type="button">Pause</button>
        <button id="reset" type="button">Reset</button>
      </div>
    </header>
    <div id="remix" class="remix" role="region" aria-label="Remix" hidden></div>
    <div class="workspace">
      <main id="viewport" class="viewport">
        <p id="status" class="status">Loading…</p>
        <div id="load-error" class="load-error" role="alert" hidden>
          <p><strong id="load-error-title">Couldn't open that model.</strong> <span id="load-error-text"></span></p>
          <p id="load-error-sub" class="load-error-sub">The previous scene is still running.</p>
          <button id="load-error-close" type="button" aria-label="Dismiss error">Dismiss</button>
        </div>
        <div id="goal" class="goal" hidden>
          <p class="goal-line"><strong id="goal-env"></strong> <span id="goal-text"></span> <span id="goal-timer" class="goal-timer" aria-hidden="true"></span></p>
          <p id="goal-tip" class="goal-tip" hidden><span id="goal-tip-text"></span> <button id="goal-tip-use" type="button"></button></p>
          <p id="goal-live" class="visually-hidden" aria-live="polite"></p>
        </div>
        <div id="share" class="share" role="dialog" aria-labelledby="share-title" data-no-drive hidden>
          <div class="share-head">
            <h2 id="share-title">Share this sim</h2>
            <button type="button" data-share-close aria-label="Close sharing">Close</button>
          </div>
          <div data-share-body></div>
        </div>
        <div id="drop-overlay" class="drop-overlay" hidden>Drop a MuJoCo .xml file to open it</div>
        <div id="drive-pad" class="pad" role="group" aria-label="Drive controls">
          <button type="button" data-key="arrowup" aria-label="Forward">▲</button>
          <button type="button" data-key="arrowleft" aria-label="Turn left">◀</button>
          <button type="button" data-key="arrowdown" aria-label="Reverse">▼</button>
          <button type="button" data-key="arrowright" aria-label="Turn right">▶</button>
        </div>
        <p id="hint" class="hint">Drive the rover with arrow keys or WASD · drag to orbit · scroll to zoom</p>
      </main>
      <aside id="builder" class="builder" aria-labelledby="builder-title" data-no-drive hidden>
        <div class="builder-head">
          <h2 id="builder-title">Build your robot</h2>
          <button id="builder-close" type="button" aria-label="Close the builder">Close</button>
        </div>
        <form id="builder-form" class="builder-form"></form>
      </aside>
      <aside id="code" class="builder code-panel" aria-labelledby="code-title" data-no-drive hidden>
        <div class="builder-head">
          <h2 id="code-title">Program your robot</h2>
          <button id="code-close" type="button" aria-label="Close the code panel">Close</button>
        </div>
        <div id="code-body" class="builder-form code-body"></div>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
